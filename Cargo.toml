[workspace]
resolver = "2"
members = [
    "crates/numeric-approximations",
    "crates/numeric-core",
    "crates/numeric-reference",
    "crates/numeric-bench",
    "crates/nova-circuit",
    "crates/experiment-runner",
    "tools/softfloat-validation",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.98"
bincode = { version = "2", features = ["serde", "std"] }
clap = { version = "4.5.40", features = ["derive"] }
criterion = { version = "0.5.1", features = ["html_reports"] }
csv = "1.3.1"
ff = "0.13.1"
libc = "0.2.186"
num-bigint = { version = "0.4.6", features = ["serde"] }
num-rational = { version = "0.4.2", features = ["serde"] }
num-traits = "0.2.19"
nova-snark = "=0.73.0"
proptest = "1.6.0"
rug = { version = "1.27.0", features = ["float", "integer", "rational", "std"], default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"

[profile.release]
debug = 1
overflow-checks = true
lto = "thin"

[profile.bench]
debug = 1
overflow-checks = true
